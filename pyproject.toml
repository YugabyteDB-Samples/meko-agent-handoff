[project]
name = "meko-agent-handoff"
version = "0.1.0"
description = "Two Strands agents sharing decisions through Meko: one records, one recalls, a person promotes, every call is traced."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # Strands Agents SDK with both provider extras this sample can use:
    # [anthropic] for MODEL_PROVIDER=anthropic (the .env.example default) and
    # [litellm] for MODEL_PROVIDER=vertex. mcp comes in transitively via strands-agents.
    "strands-agents[anthropic,litellm]>=1.48.0",
    # Loads .env for local runs.
    "python-dotenv>=1.2.2",
    # Only used by the Vertex AI / Application Default Credentials path.
    "google-auth>=2.56.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Flat-layout sample (the scripts and meko_client.py are run directly, not installed
# as a package), so uv should not try to build/install this project itself.
package = false

[tool.pytest.ini_options]
# Flat layout: put the repo root on sys.path so tests can import the scripts
# and meko_client without a package install.
pythonpath = ["."]
markers = [
    "integration: exercises real Meko (and optionally real inference); skipped unless credentials are present. Opt in with -m integration.",
]
